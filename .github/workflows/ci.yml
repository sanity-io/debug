name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 'Build, lint, type-check, and coverage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      - run: npx ls-engines
      - run: pnpm exec oxfmt --check
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run lint -- --quiet
      - run: pnpm run coverage

  test-node:
    name: 'Node.js ${{ matrix.node }}, ${{ matrix.platform }}'
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Ubuntu
            node: '22.13.0'
          - os: ubuntu-latest
            platform: Ubuntu
            node: '24'
          - os: ubuntu-latest
            platform: Ubuntu
            node: '26'
          - os: macos-latest
            platform: macOS
            node: '24'
          - os: windows-latest
            platform: Windows
            node: '24'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: ${{ matrix.node }}
      - run: pnpm install --frozen-lockfile
      - run: npx ls-engines
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run test:smoke:node

  test-browser:
    name: 'Chromium, Firefox, and WebKit'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm run test:browser
      - run: pnpm run build
      - run: pnpm run test:smoke:browser

  test-bun:
    name: Bun
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:bun
      - run: pnpm run build
      - run: pnpm run test:smoke:bun

  test-deno:
    name: Deno
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - uses: denoland/setup-deno@v2
        with:
          deno-version: latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:deno

  test-happy-dom:
    name: happy-dom
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:happy-dom
      - run: pnpm run build
      - run: pnpm run test:smoke:happy-dom

  test-jsdom:
    name: jsdom
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:jsdom
      - run: pnpm run build
      - run: pnpm run test:smoke:jsdom

  test-react-server:
    name: React Server Components
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:react-server
      - run: pnpm run build
      - run: pnpm run test:smoke:react-server

  test-vercel-edge:
    name: Vercel Edge
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:vercel-edge
      - run: pnpm run build
      - run: pnpm run test:smoke:vercel-edge

  test-workerd:
    name: workerd
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:workerd
      - run: pnpm run build
      - run: pnpm run test:smoke:workerd
